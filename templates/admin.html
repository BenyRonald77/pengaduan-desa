{% extends "base.html" %}
{% block content %}
<h2>Dashboard Admin</h2>
<div id="stat" class="cards"></div>
<h3>Disposisi Laporan Baru</h3>
<table id="tbl"><thead><tr><th>Kode</th><th>Kategori</th><th>Judul</th><th>Dibuat</th><th>Deadline</th><th>Petugas</th><th>Aksi</th></tr></thead><tbody></tbody></table>
<h3>Diproses</h3>
<table id="tbl2"><thead><tr><th>Kode</th><th>Judul</th><th>Petugas</th><th>Terlambat</th><th>Catatan</th><th>Aksi</th></tr></thead><tbody></tbody></table>
{% endblock %}
{% block scripts %}
<script>
let petugas = [];
async function load() {
  petugas = await api("/api/petugas");
  const s = await api("/api/publik/statistik");
  el("stat").innerHTML =
    s.per_status.map(x => `<div class="card"><h4>${x.status}</h4><p><b>${x.jumlah}</b> laporan</p></div>`).join("") +
    `<div class="card"><h4>Tanggapan terlambat</h4><p><b class="warn">${s.tanggapan_terlambat}</b></p></div>
     <div class="card"><h4>Lewat deadline, belum ditanggapi</h4><p><b class="warn">${s.melewati_deadline_belum_ditanggapi}</b></p></div>`;
  const baru = await api("/api/laporan?status=baru");
  el("tbl").querySelector("tbody").innerHTML = baru.map(l => `
    <tr><td>${l.kode_tiket}</td><td>${l.kategori}</td><td>${l.judul}</td>
    <td>${l.dibuat_pada}</td><td>${l.deadline_respons}</td>
    <td><select id="p${l.id}">${petugas.filter(p => p.kategori === l.kategori).map(p => `<option value="${p.id}">${p.nama}</option>`).join("")}</select></td>
    <td><button onclick="disposisi(${l.id})">Disposisikan</button></td></tr>`).join("");
  const pr = await api("/api/laporan?status=diproses");
  el("tbl2").querySelector("tbody").innerHTML = pr.map(l => `
    <tr><td>${l.kode_tiket}</td><td>${l.judul}</td><td>${l.nama_petugas}</td>
    <td>${l.terlambat ? '<b class="warn">YA</b>' : 'tidak'}</td>
    <td><input id="c${l.id}" placeholder="catatan penyelesaian/alasan"></td>
    <td><button onclick="selesai(${l.id})">Selesai</button>
        <button onclick="tolak(${l.id})" class="danger">Tolak</button></td></tr>`).join("");
}
async function disposisi(id) {
  const petugas_id = +el("p" + id).value;
  const r = await fetch(`/api/laporan/${id}/disposisi`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({petugas_id})});
  if (r.ok) load(); else alert((await r.json()).error);
}
async function setStatus(id, status) {
  const catatan = el("c" + id).value;
  const r = await fetch(`/api/laporan/${id}/status`, {method: "PATCH", headers: {"Content-Type": "application/json"}, body: JSON.stringify({status, catatan})});
  if (r.ok) load(); else alert((await r.json()).error);
}
const selesai = id => setStatus(id, "selesai");
const tolak = id => setStatus(id, "ditolak");
load();
</script>
{% endblock %}

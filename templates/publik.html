{% extends "base.html" %}
{% block content %}
<h2>Daftar Laporan Publik</h2>
<p><select id="filter"><option value="">Semua status</option></select></p>
<div id="list" class="grid"></div>
{% endblock %}
{% block scripts %}
<script>
el("filter").innerHTML += STATUS.map(s => `<option>${s}</option>`).join("");
async function load() {
  const st = el("filter").value;
  const r = await api("/api/publik/laporan" + (st ? "?status=" + st : ""));
  el("list").innerHTML = r.map(d => `
    <div class="card">
      <h4>${d.judul}</h4>
      <p><b>${d.kode_tiket}</b> · ${d.kategori}
      · <span class="badge ${d.status}">${d.status}</span>
      ${d.terlambat ? '<span class="badge telat">terlambat</span>' : ''}</p>
      ${d.foto ? `<img src="/api/uploads/${d.foto}">` : ""}
      <p>${d.deskripsi.slice(0, 120)}…</p>
      <p>Pelapor: ${d.pelapor} · ${d.dibuat_pada}</p>
    </div>`).join("");
}
el("filter").onchange = load;
load();
</script>
{% endblock %}
